<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:24px 16px;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#143453;">

    <tr><td style="padding:32px 24px;">

      <p style="margin:0 0 16px;font-size:14px;line-height:1.6;">Код действует 10 минут. Не сообщайте его другим людям.</p>
      <p style="margin:0;font-size:14px;line-height:1.6;color:#66788c;">Если вы не регистрировались, просто проигнорируйте письмо.</p>
