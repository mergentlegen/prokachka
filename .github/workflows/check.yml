name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: test-only
      PROKACHKA_TEST_PG_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Bootstrap disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/database-roles.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/realtime-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/bootstrap.sql
      - name: Database integration and concurrent requests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/telegram-integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/architecture-integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/live-updates.sql
          npm run test:concurrency
